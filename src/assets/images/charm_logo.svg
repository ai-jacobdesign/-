<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <!-- Cyan to Blue gradient for upper crescent arc -->
    <linearGradient id="cArcGradientUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aeeef" />
      <stop offset="50%" stop-color="#00a0e9" />
      <stop offset="100%" stop-color="#0072bc" />
    </linearGradient>
    <!-- Blue gradient for lower wave swoosh -->
    <linearGradient id="cArcGradientLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088d6" />
      <stop offset="60%" stop-color="#0040a8" />
      <stop offset="100%" stop-color="#001a70" />
    </linearGradient>
  </defs>

  <!-- Symbol Container -->
  <g transform="translate(10, 10)">
    <!-- Main C Crescent Outer Path -->
    <!-- Top arm starting top right, curving around left to bottom swoosh -->
    <path d="M 105,18 
             C 70,8 30,22 15,55 
             C 0,88 12,125 45,138 
             C 70,148 102,142 125,128
             C 100,132 72,126 55,112 
             C 35,96 30,72 40,48 
             C 50,28 75,18 105,18 Z" 
          fill="url(#cArcGradientUpper)" />

    <!-- Swooping lower wave overlay -->
    <path d="M 20,90 
             C 30,122 62,142 125,128 
             C 95,135 65,125 48,105 
             C 35,88 38,62 50,45 
             C 38,60 30,78 20,90 Z" 
          fill="url(#cArcGradientLower)" />

    <!-- Inner Cross (+) Symbol -->
    <g transform="translate(60, 48)">
      <rect x="18" y="0" width="20" height="56" rx="8" fill="#0042b3" />
      <rect x="0" y="18" width="56" height="20" rx="8" fill="#0042b3" />
    </g>
  </g>

  <!-- Text Section -->
  <!-- '사) 누가' -->
  <text x="180" y="34" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-weight="700" font-size="20" fill="#002166">사) 누가</text>
  
  <!-- '참의원' -->
  <text x="180" y="94" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-weight="900" font-size="58" fill="#001a66" letter-spacing="-1.5">참의원</text>

  <!-- 'Charm Medical Center' -->
  <text x="182" y="132" font-family="Arial, 'Helvetica Neue', sans-serif" font-weight="700" font-size="26" fill="#001a66" letter-spacing="-0.5">Charm Medical Center</text>
</svg>